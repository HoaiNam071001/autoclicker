<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Auto Clicker – Bước gõ chữ với biến</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 360px; height: 760px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: {{c.surface}}; color: {{c.text}}; border: 1px solid {{c.border}}; border-radius: 12px; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; position: relative">

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 9px; background: {{c.accentSoft}}; color: {{c.accentText}}; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5h12v2M10 5v14M7 19h6M15 13h5M17.5 13v6"></path></svg></span>
<div style="flex: 1"><div style="font-weight: 600; font-size: 15px">Gõ chữ</div><div style="color: {{c.muted}}; font-size: 12px">Bước 5, trong nhóm Gửi tin</div></div>
<span style="width: 40px; height: 20px; border-radius: 10px; background: {{c.accent}}; position: relative" role="img" aria-label="Bật"><span style="position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF"></span></span>
</div>

<div style="display: flex; gap: 18px; border-bottom: 1px solid {{c.border}}; margin-top: -4px">
<button style="height: 34px; padding: 0 2px; border: 0; background: transparent; color: {{c.text}}; font: inherit; font-weight: 600; position: relative">Bước<span style="position: absolute; left: 20%; right: 20%; bottom: -1px; height: 3px; border-radius: 2px; background: {{c.accent}}"></span></button>
<button style="height: 34px; padding: 0 2px; border: 0; background: transparent; color: {{c.muted}}; font: inherit; display: flex; align-items: center; gap: 6px">Input <span style="font-size: 11px; font-weight: 600; color: {{c.accentText}}; background: {{c.accentSoft}}; padding: 0 6px; border-radius: 999px">5</span></button>
</div>

<section style="display: flex; flex-direction: column; gap: 8px; position: relative">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-weight: 600">Nội dung</span><span style="font-size: 12px; color: {{c.muted}}">gõ <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace">{{brace}}</span> để chèn biến</span></div>
<div style="min-height: 88px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: {{c.focusRing}}; line-height: 1.9">
xin chào <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 13px; color: {{c.accentText}}; background: {{c.accentSoft}}; padding: 2px 6px; border-radius: 5px">{{t1}}</span> và <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 13px; color: {{c.accentText}}; background: {{c.accentSoft}}; padding: 2px 6px; border-radius: 5px">{{t2}}</span>, <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 13px; color: {{c.muted}}">{{brace}}</span><span style="display: inline-block; width: 1.5px; height: 16px; background: {{c.text}}; vertical-align: -3px"></span>
</div>

<div style="position: absolute; left: 92px; top: 150px; width: 252px; z-index: 2; background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,{{c.popShadow}}); padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{suggest}}" as="s" hint-placeholder-count="3">
<button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 7px; background: {{s.bg}}; color: {{c.text}}; font: inherit; text-align: left">
<span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 12px; color: {{c.accentText}}; min-width: 56px">{{s.key}}</span>
<span style="flex: 1; color: {{c.muted}}; font-size: 13px">{{s.label}}</span>
</button>
</sc-for>
<div style="height: 1px; background: {{c.border}}; margin: 2px 4px"></div>
<button style="height: 36px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: {{c.text}}; font: inherit; font-size: 13px; text-align: left">+ Tạo input mới…</button>
</div>

<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{c.muted}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
2 biến, tự thêm vào tab Input
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; margin-top: 170px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="color: {{c.muted}}">{{f.label}}</span>
<div style="display: flex; gap: 6px">
<span style="flex: 1; display: flex; align-items: center; height: 32px; border-radius: 6px; padding: 0 10px; background: {{c.field}}; border: 1px solid {{c.border}}; font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 13px">{{f.value}}<span style="margin-left: auto; color: {{c.muted}}">{{f.unit}}</span></span>
<button aria-label="Đặt làm input" title="Đặt làm input" style="width: 32px; height: 32px; border: 1px solid {{f.pinBorder}}; border-radius: 6px; background: {{f.pinBg}}; color: {{f.pinFg}}; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3zM12 14v6"></path></svg></button>
</div>
</div>
</sc-for>
<span style="font-size: 12px; color: {{c.muted}}">Bấm ghim để cho phép đổi giá trị khi chạy. Giá trị hiện tại thành mặc định.</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","default":"#4F6BED","options":["#4F6BED","#2F8F83","#8B6CE0","#5B6472"]},"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const a = this.props.accent ?? '#4F6BED';
    const hex = (h, al) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')'; };
    const c = dark ? {
      surface: '#1E1F23', field: '#17181B', text: '#ECEDF0', muted: '#A0A5B0', border: 'rgba(255,255,255,.08)', hover: 'rgba(255,255,255,.06)',
      accentSoft: hex(a, .16), accentText: '#B4C1FF', popShadow: '.45'
    } : {
      surface: '#FFFFFF', field: '#FFFFFF', text: '#16181D', muted: '#636A76', border: '#E6E8EC', hover: 'rgba(22,24,29,.05)',
      accentSoft: hex(a, .1), accentText: '#3B55CF', popShadow: '.12'
    };
    c.accent = a;
    c.focusRing = 'linear-gradient(' + c.field + ', ' + c.field + ') padding-box, linear-gradient(90deg, ' + a + ', ' + hex(a, .2) + ') border-box';
    const suggest = [
      { key: 'M1', label: 'Tên người nhận', bg: c.hover },
      { key: 'M2', label: 'Lời nhắn', bg: 'transparent' },
      { key: 'profile', label: 'Trang cá nhân', bg: 'transparent' }
    ];
    const pin = (on) => ({ pinBg: on ? c.accentSoft : 'transparent', pinFg: on ? c.accentText : c.muted, pinBorder: on ? hex(a, .45) : c.border });
    const fields = [
      Object.assign({ label: 'Cách nhau giữa các ký tự', value: '30', unit: 'ms' }, pin(false)),
      Object.assign({ label: 'Ngẫu nhiên thời gian', value: '±10', unit: 'ms' }, pin(false)),
      Object.assign({ label: 'Chờ trước bước tiếp', value: '200', unit: 'ms' }, pin(false))
    ];
    return { c, suggest, fields, brace: '{{', t1: '{{M1}}', t2: '{{M2}}' };
  }
}
</script>
</body>
</html>
