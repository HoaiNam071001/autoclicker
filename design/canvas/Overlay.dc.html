<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Auto Clicker – Chụp ảnh mẫu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #C9CDD4; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Plus Jakarta Sans', system-ui, sans-serif; color: #16181D; font-size: 14px">

<div style="position: absolute; left: 120px; top: 70px; width: 1200px; height: 760px; background: #FFFFFF; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.45)">
<div style="height: 44px; background: #EEF0F3; display: flex; align-items: center; padding: 0 16px; gap: 12px">
<span style="height: 26px; flex: 1; max-width: 520px; border-radius: 8px; background: #FFFFFF; color: #5E6573; font-size: 12px; display: flex; align-items: center; padding: 0 12px">facebook.com/[ten-nguoi-dung]</span>
</div>
<div style="height: 220px; background: #E6E9EE; display: grid; place-items: center; color: #5E6573">[Ảnh bìa]</div>
<div style="display: flex; align-items: flex-end; gap: 20px; padding: 0 60px; margin-top: -50px">
<span style="width: 150px; height: 150px; border-radius: 50%; background: #CBD0D8; border: 5px solid #FFFFFF"></span>
<div style="flex: 1; padding-bottom: 18px"><div style="font-size: 26px; font-weight: 700">[Tên người dùng]</div><div style="color: #5E6573">[Thông tin phụ]</div></div>
<div style="display: flex; gap: 10px; padding-bottom: 24px">
<span style="width: 140px; height: 44px; border-radius: 8px; background: #E6E9EE"></span>
<span style="width: 148px; height: 44px; border-radius: 8px; background: #DCE6FF; display: grid; place-items: center; font-weight: 600; color: #1E3FAF">Nhắn tin</span>
</div>
</div>
<div style="margin: 30px 60px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<span style="height: 220px; border-radius: 10px; background: #F1F3F6"></span><span style="height: 220px; border-radius: 10px; background: #F1F3F6"></span><span style="height: 220px; border-radius: 10px; background: #F1F3F6"></span>
</div>
</div>

<div style="position: absolute; left: 1104px; top: 366px; width: 164px; height: 64px; border: 2px dashed #FFFFFF; border-radius: 6px; box-shadow: 0 0 0 4000px rgba(14,16,22,.5)"></div>
<span style="position: absolute; left: 1098px; top: 360px; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span style="position: absolute; left: 1262px; top: 360px; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span style="position: absolute; left: 1098px; top: 424px; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span style="position: absolute; left: 1262px; top: 424px; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 2px solid {{accent}}"></span>
<span style="position: absolute; left: 1104px; top: 330px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FFFFFF; background: {{accent}}; padding: 3px 8px; border-radius: 6px">Ảnh mẫu 164 × 64</span>

<div style="position: absolute; left: 1040px; top: 446px; display: flex; gap: 6px; padding: 6px; background: #1E1F23; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35)">
<button style="height: 38px; padding: 0 14px; border-radius: 8px; background: linear-gradient(180deg, rgba(79,107,237,.82), #4F6BED); border: 1px solid rgba(79,107,237,.9); color: #FFFFFF; box-shadow: 0 1px 0 rgba(255,255,255,.25) inset; font: inherit; font-weight: 600">Dùng ảnh này</button>
<button style="height: 38px; padding: 0 14px; border: 0; border-radius: 8px; background: rgba(255,255,255,.1); color: #F3F4F8; font: inherit">Khoanh lại</button>
</div>

<div style="position: absolute; left: 50%; top: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1E1F23; border: 1px solid rgba(255,255,255,.1); color: #FFFFFF; border-radius: 10px; font-size: 13px">
<span style="width: 22px; height: 22px; border-radius: 7px; background: #F3EEFF; color: #5B21B6; display: grid; place-items: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"></path></svg></span>
Kéo để khoanh ảnh mẫu cho <b>bước 03: Chờ ảnh nút Nhắn tin</b>
</div>

<div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: #1E1F23; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.4); color: #D7DAE0">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
<button style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 7px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</button>
</sc-for>
<span style="width: 1px; height: 26px; background: rgba(255,255,255,.16); margin: 0 6px"></span>
<button style="height: 44px; padding: 0 14px; border: 0; border-radius: 11px; background: transparent; color: #D7DAE0; font: inherit">Xem trước</button>
<button style="height: 44px; padding: 0 16px; border-radius: 8px; background: linear-gradient(180deg, rgba(79,107,237,.82), #4F6BED); border: 1px solid rgba(79,107,237,.9); color: #FFFFFF; box-shadow: 0 1px 0 rgba(255,255,255,.25) inset; font: inherit; font-weight: 700">Xong <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: .7">Esc</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F6BED","options":["#4F6BED","#2F8F83","#8B6CE0","#5B6472"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4F6BED';
    const t = (label, icon, on) => ({ label, icon, bg: on ? 'rgba(255,255,255,.14)' : 'transparent', fg: on ? '#FFFFFF' : '#D7DAE0' });
    const tools = [
      t('Đặt điểm', 'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 2v3M12 19v3M2 12h3M19 12h3'),
      t('Kéo thả', 'M5 19a2 2 0 1 0 0-.01M7 17L18 6M13 6h5v5'),
      t('Chọn vùng', 'M3 5h18v14H3z'),
      t('Chụp ảnh mẫu', 'M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0', true)
    ];
    return { accent, tools };
  }
}
</script>
</body>
</html>
