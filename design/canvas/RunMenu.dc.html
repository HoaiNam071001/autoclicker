<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Auto Clicker – Nút Chạy và menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 340px; height: 320px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13.5px">
<div style="display: flex; border-radius: 7px; box-shadow: {{c.btnShadow}}">
<button style="height: 34px; padding: 0 14px; display: flex; align-items: center; gap: 9px; border: 1px solid {{c.btnEdge}}; border-right: 0; border-radius: 7px 0 0 7px; background: {{c.btnGrad}}; color: #FFFFFF; font: inherit; font-weight: 600"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>Chạy <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400; opacity: .8">F8</span></button>
<button aria-label="Cách chạy khác" aria-expanded="true" style="width: 30px; height: 34px; border: 1px solid {{c.btnEdge}}; border-left: 1px solid rgba(255,255,255,.3); border-radius: 0 7px 7px 0; background: {{c.btnGrad}}; color: #FFFFFF; display: grid; place-items: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg></button>
</div>
<div role="menu" style="width: 280px; padding: 6px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; box-shadow: 0 12px 32px rgba(0,0,0,{{c.shadow}}); display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 7px; background: {{it.bg}}; color: {{c.text}}; font: inherit; text-align: left">
<span style="width: 18px; display: grid; place-items: center; color: {{it.icColor}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
<span style="flex: 1">{{it.label}}</span>
<span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px; color: {{c.muted}}">{{it.key}}</span>
</button>
</sc-for>
<div style="height: 1px; background: {{c.border}}; margin: 4px 6px"></div>
<button role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: {{c.muted}}; font: inherit; font-size: 12.5px; text-align: left">Sửa input trước khi chạy<span style="margin-left: auto; font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px">Shift+F8</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","default":"#4F6BED","options":["#4F6BED","#2F8F83","#5B6472"]},"$preview":{"width":340,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const a = this.props.accent ?? '#4F6BED';
    const hex = (h, al) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')'; };
    const c = dark
      ? { bg: '#18191C', surface: '#1E1F23', text: '#ECEDF0', muted: '#A0A5B0', border: 'rgba(255,255,255,.08)', hover: 'rgba(255,255,255,.06)', shadow: '.45', danger: '#FF9A9D' }
      : { bg: '#FBFBFC', surface: '#FFFFFF', text: '#16181D', muted: '#636A76', border: '#E6E8EC', hover: 'rgba(22,24,29,.05)', shadow: '.12', danger: '#B4252B' };
    c.btnGrad = 'linear-gradient(180deg, ' + hex(a, .82) + ' 0%, ' + a + ' 100%)';
    c.btnEdge = hex(a, .9);
    c.btnShadow = '0 1px 0 rgba(255,255,255,.25) inset, 0 4px 12px ' + hex(a, dark ? .25 : .2);
    const items = [
      { label: 'Chạy từ node đang chọn', key: '', icon: 'M5 4l10 8-10 8zM19 5v14', icColor: c.muted, bg: c.hover },
      { label: 'Chạy từng node', key: 'F10', icon: 'M4 12h12M12 6l6 6-6 6M20 5v14', icColor: c.muted, bg: 'transparent' },
      { label: 'Xem trước trên màn hình', key: '', icon: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', icColor: c.muted, bg: 'transparent' },
      { label: 'Ghi thao tác', key: 'F9', icon: 'M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14z', icColor: c.danger, bg: 'transparent' }
    ];
    return { c, items };
  }
}
</script>
</body>
</html>
