<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Auto Clicker – Hệ màu nhóm node</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1160px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<div style="flex: 1; box-sizing: border-box; padding: 22px 24px; background: {{m.bg}}; color: {{m.text}}; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 600; color: {{m.muted}}">{{m.label}}</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{m.cats}}" as="k" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{k.fg}}"></span>{{k.name}}</span>
<div style="position: relative; border-radius: 10px; border: 1px solid {{m.border}}; background: {{m.surface}}">
<div style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 8px; border-radius: 9px 9px 0 0; background: {{k.soft}}">
<span style="width: 20px; height: 20px; flex: none; border-radius: 6px; background: {{k.tile}}; color: {{k.fg}}; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
<span style="font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.sample}}</span>
</div>
<div style="padding: 5px 10px 7px; font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px; color: {{m.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.summary}}</div>
</div>
<span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px; color: {{m.muted}}">{{k.fg}}</span>
<span style="font-size: 12px; line-height: 1.5; color: {{m.muted}}">{{k.items}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1160,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      ['Chuột', '#3657C8', '#8EA8FF', '62,99,221', 'M5 3l13 7-6 1.5L9 18z', 'Click ×5', 'X 812 Y 436', 'Click, Double, Giữ, Kéo thả, Cuộn, Click theo ảnh, Vẽ đường'],
      ['Bàn phím', '#0E7C71', '#5FD3C4', '15,138,126', 'M4 7V5h12v2M10 5v14M7 19h6M15 13h5M17.5 13v6', 'Gõ lời nhắn', '"xin chào {{M1}}"', 'Gõ chữ, Phím tắt'],
      ['Chờ & ảnh', '#6A4BC4', '#B9A4FF', '124,92,214', 'M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0', 'Chờ nút', 'tối đa 10 s', 'Chờ, Chờ ảnh, Chờ pixel, Chờ đến giờ, Chụp màn hình'],
      ['Hệ thống & dữ liệu', '#93580A', '#F2B24D', '214,140,20', 'M4 7h16M4 12h10M4 17h7M17 14l3 3-3 3', 'Gửi log', 'POST hooks…/log', 'HTTP, Clipboard, Tệp, Hệ thống, Đặt biến'],
      ['Ứng dụng', '#4F5866', '#B4BAC4', '91,100,114', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18', 'Mở trang', 'facebook.com/…', 'Mở URL / app, Focus cửa sổ, Đọc phần tử'],
      ['Rẽ nhánh & luồng', '#B0306A', '#F28BB8', '194,65,122', 'M6 3v6M6 9c0 4 6 4 6 8v4M6 9c0 4-4 4-4 8M18 3v18', 'Đang ở màn nào?', '3 case', 'Nếu, Switch, Switch màn hình, Đếm, Kết thúc'],
      ['Web', '#0B6F94', '#6CCDF0', '14,127,168', 'M3 5h18v14H3zM3 9h18M7 7h.01', 'Click nút Gửi', 'button[type=submit]', 'Chờ, Click, Gõ, Đọc, Cuộn phần tử web']
    ];
    const mk = (dark) => ({
      label: dark ? 'Tối' : 'Sáng',
      bg: dark ? '#141518' : '#EFF1F4', surface: dark ? '#1E1F23' : '#FFFFFF', text: dark ? '#ECEDF0' : '#16181D',
      muted: dark ? '#A0A5B0' : '#636A76', border: dark ? 'rgba(255,255,255,.08)' : '#E6E8EC',
      cats: defs.map((d) => ({
        name: d[0], fg: dark ? d[2] : d[1],
        soft: 'rgba(' + d[3] + ',' + (dark ? .12 : .08) + ')', tile: 'rgba(' + d[3] + ',' + (dark ? .24 : .16) + ')',
        icon: d[4], sample: d[5], summary: d[6], items: d[7]
      }))
    });
    return { modes: [mk(false), mk(true)] };
  }
}
</script>
</body>
</html>
