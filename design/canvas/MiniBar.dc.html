<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Auto Clicker – Đang chạy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 540px; height: 96px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 16px; background: {{c.surface}}; color: {{c.text}}; border: 1px solid {{c.border}}; border-radius: 14px; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px">
<div style="position: relative; width: 50px; height: 50px; flex: none">
<svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true">
<defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{c.accent}}"></stop><stop offset="1" stop-color="{{c.accent}}" stop-opacity=".35"></stop></linearGradient></defs>
<circle cx="25" cy="25" r="22" fill="none" stroke="{{c.track}}" stroke-width="3.5"></circle>
<circle cx="25" cy="25" r="22" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 25 25)"></circle></svg>
<span style="position: absolute; inset: 10px; border-radius: 50%; background: {{c.accentSoft}}; color: {{c.accentText}}; display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0"></path></svg></span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bước 3 / 8: Chờ ảnh nút Nhắn tin</span>
<span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 12px; color: {{c.muted}}; white-space: pre">đang tìm 4.2 / 10 s   thử lại 0 / 2</span>
<span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 12px; color: {{c.muted}}; white-space: pre">vòng 2 / 10   38 click   01:26</span>
</div>
<button aria-label="Tạm dừng" style="width: 44px; height: 44px; border: 1px solid {{c.border}}; border-radius: 9px; background: {{c.btn}}; color: {{c.text}}; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></button>
<button style="height: 44px; padding: 0 14px; border: 1px solid {{c.stopEdge}}; border-radius: 9px; background: {{c.stopBg}}; color: {{c.stopText}}; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect></svg>Dừng <span style="font-family: 'Cascadia Mono', 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400; opacity: .75">F8</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","default":"#4F6BED","options":["#4F6BED","#2F8F83","#8B6CE0","#5B6472"]},"waitProgress":{"editor":"range","default":42,"min":0,"max":100,"unit":"%"},"$preview":{"width":540,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const a = this.props.accent ?? '#4F6BED';
    const hex = (h, al) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')'; };
    const c = dark ? {
      surface: '#1E1F23', text: '#ECEDF0', muted: '#A0A5B0', border: 'rgba(255,255,255,.08)', btn: 'rgba(255,255,255,.05)',
      track: 'rgba(255,255,255,.08)', accentSoft: hex(a, .16), accentText: '#B4C1FF',
      stopBg: 'rgba(229,72,77,.14)', stopEdge: 'rgba(229,72,77,.35)', stopText: '#FF9A9D'
    } : {
      surface: '#FFFFFF', text: '#16181D', muted: '#636A76', border: '#E6E8EC', btn: '#FFFFFF',
      track: 'rgba(22,24,29,.07)', accentSoft: hex(a, .1), accentText: '#3B55CF',
      stopBg: 'rgba(214,52,58,.08)', stopEdge: 'rgba(214,52,58,.3)', stopText: '#B4252B'
    };
    c.accent = a;
    const p = (this.props.waitProgress ?? 42) / 100;
    const circ = 2 * Math.PI * 22;
    return { c, dash: (circ * p).toFixed(1) + ' ' + circ.toFixed(1) };
  }
}
</script>
</body>
</html>
