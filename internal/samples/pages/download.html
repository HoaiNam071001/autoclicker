<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="sandbox.css">
<style>
  main { padding: 24px 40px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
  #status { font-size: 32px; font-weight: 800; }
</style></head>
<body>
<main>
  <button class="btn" id="dl">TAI BAO CAO</button>
  <div id="status"></div>
  <div class="stats"></div>
  <div class="log"></div>
</main>
<script src="sandbox.js"></script>
<script>
  // Tải file (bước 43 B6): bấm nút → trình duyệt tải ghosthand-bao-cao-<giờ>.txt về thư mục Downloads sau ~2 s
  // (Chrome hiện .crdownload rồi mới đổi tên) – node Chờ tải xong chờ file đó. Tên có giờ nên lần nào cũng là file mới.
  sb.header('Tải file');
  const setN = sb.stat('Lần bấm tải', 0);
  let n = 0;
  document.getElementById('dl').addEventListener('click', () => {
    n++; setN(n);
    document.getElementById('status').textContent = 'DANG TAI…';
    setTimeout(() => {
      const body = 'Bao cao ghosthand\n' + 'x'.repeat(2000) + '\n' + new Date().toISOString() + '\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([body], { type: 'text/plain' }));
      a.download = 'ghosthand-bao-cao-' + Date.now() + '.txt';
      a.click();
      document.getElementById('status').textContent = 'DA GUI FILE';
    }, 2000);
  });
</script>
</body></html>
