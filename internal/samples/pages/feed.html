<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="sandbox.css">
<style>
  #feed { max-width: 620px; margin: 0 auto; padding: 16px 20px 80px; display: flex; flex-direction: column; gap: 16px; }
  .post { display: flex; flex-direction: column; gap: 10px; }
  .post .who { font-weight: 800; font-size: 18px; }
  .post .img { height: 220px; border-radius: 10px; }
  .post .row { display: flex; gap: 10px; }
  .post .row button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .post.special { border: 3px solid var(--warn); }
  .post.special .title { font-size: 30px; font-weight: 900; color: #b45309; }
  .liked { background: #fee2e2 !important; border-color: var(--danger) !important; }
  #loading { text-align: center; color: var(--muted); padding: 20px; }
</style></head>
<body>
<div id="feed"></div>
<div id="loading">Đang tải thêm bài…</div>
<div class="stats" style="position:fixed;right:0;bottom:0;"></div>
<script src="sandbox.js"></script>
<script>
  // Feed cuộn vô hạn: gần cuối trang thì nạp thêm 5 bài (giả lập 300 ms). Bài ĐẶC BIỆT nằm ngẫu nhiên ở bài 12–25,
  // có nút riêng THẢ TIM BÀI NÀY; các bài thường có nút Thích.
  sb.header('Feed mạng xã hội');
  const setPosts = sb.stat('Số bài đã nạp'), setLike = sb.stat('Tim bài đặc biệt');
  const special = Math.floor(sb.rand(12, 26));
  const names = ['Lan', 'Minh', 'Hà', 'Tuấn', 'Mai', 'Quân', 'Thảo', 'Long'];
  const feed = document.getElementById('feed');
  let n = 0, loading = false;
  const post = (i) => {
    const d = document.createElement('div');
    const hue = (i * 47) % 360;
    if (i === special) {
      d.className = 'card post special';
      d.innerHTML = `<div class="title">⭐ BÀI ĐẶC BIỆT</div><div>Bài thứ ${i} – kịch bản cần cuộn tới đây rồi thả tim.</div>
        <div class="img" style="background:linear-gradient(135deg,#fde68a,#f59e0b)"></div>
        <div class="row"><button class="heart">THẢ TIM BÀI NÀY</button></div>`;
    } else {
      d.className = 'card post';
      d.innerHTML = `<div class="who">${names[i % names.length]} · bài ${i}</div><div>Nội dung bài viết số ${i}.</div>
        <div class="img" style="background:hsl(${hue} 55% 75%)"></div><div class="row"><button>Thích</button><button>Bình luận</button></div>`;
    }
    feed.appendChild(d);
  };
  const more = () => {
    if (loading) return;
    loading = true;
    setTimeout(() => { for (let k = 0; k < 5; k++) post(++n); setPosts(n); loading = false; }, 300);
  };
  for (let k = 0; k < 5; k++) post(++n);
  setPosts(n);
  addEventListener('scroll', () => { if (innerHeight + scrollY > document.body.scrollHeight - 600) more(); });
  let hearts = 0;
  feed.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    b.classList.toggle('liked');
    if (b.classList.contains('heart')) { setLike(++hearts); b.textContent = 'ĐÃ THẢ TIM ❤️'; }
  });
</script>
</body></html>
