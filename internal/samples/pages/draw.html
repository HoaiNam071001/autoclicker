<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="sandbox.css">
<style>
  body { display: flex; flex-direction: column; }
  #wrap { flex: 1; margin: 0 20px 12px; position: relative; min-height: 300px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; border: 3px dashed var(--line); border-radius: 16px; background: var(--surface); cursor: crosshair; }
  #wrap .big { position: absolute; inset: 0; display: grid; place-items: center; color: #e5e7eb; pointer-events: none; }
</style></head>
<body>
<div class="stats"></div>
<div id="wrap"><div class="big">BẢNG VẼ</div><canvas id="cv"></canvas></div>
<div class="log"></div>
<script src="sandbox.js"></script>
<script>
  // Mỗi lần giữ chuột → kéo → thả vẽ một vệt (màu khác nhau), ghi điểm đầu / cuối theo toạ độ màn hình.
  sb.header('Bảng vẽ');
  const setCount = sb.stat('Số lần kéo'), setLen = sb.stat('Dài nhất (px)'), setLast = sb.stat('Lần cuối', '–');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const palette = ['#2563eb', '#dc2626', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2'];
  let drag = null, count = 0, maxLen = 0;
  const fit = () => {
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  addEventListener('resize', fit);
  const at = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const [x, y] = at(e);
    drag = { x0: x, y0: y, sx: e.screenX, sy: e.screenY, t0: performance.now(), color: palette[count % palette.length] };
    ctx.strokeStyle = drag.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.fillStyle = drag.color; ctx.fillRect(x - 6, y - 6, 12, 12);
  });
  cv.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const [x, y] = at(e);
    ctx.lineTo(x, y); ctx.stroke();
  });
  addEventListener('mouseup', (e) => {
    if (!drag) return;
    const [x, y] = at(e);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = drag.color; ctx.fill();
    const len = Math.round(Math.hypot(e.screenX - drag.sx, e.screenY - drag.sy));
    const ms = Math.round(performance.now() - drag.t0);
    setCount(++count);
    if (len > maxLen) setLen(maxLen = len);
    setLast(`${len} px / ${ms} ms`);
    sb.log(`kéo (${drag.sx}, ${drag.sy}) → (${e.screenX}, ${e.screenY}), dài ${len} px, ${ms} ms`);
    drag = null;
  });
</script>
</body></html>
