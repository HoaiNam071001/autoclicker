# Build bản Windows (.exe) mỗi lần push (bước 18a) – tải về ở tab Actions → lần chạy → Artifacts.
# Build chéo trên Linux bằng MinGW-w64 (robotgo / gohook cần cgo); đã thử trên máy Linux ra exe chạy được build.
name: Build Windows

on:
  push:
    paths-ignore: ['docs/**', 'design/**', '**.md']
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài MinGW-w64 + Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 p7zip-full
          go install github.com/wailsapp/wails/v2/cmd/wails@v$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2 | sed 's/^v//')
      - name: Bộ Tesseract kèm exe (OCR tiếng Việt – bước 40)
        run: bash scripts/fetch-tesseract.sh
      - name: Build exe
        # wails tắt cgo khi build chéo → bật lại; binding (frontend/wailsjs) đã commit nên bỏ bước sinh binding
        env:
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: wails build -platform windows/amd64 -skipbindings -trimpath -ldflags "-s -w"
      - uses: actions/upload-artifact@v4
        with:
          name: ghosthand-windows-${{ github.sha }}
          path: build/bin/ghosthand.exe
          retention-days: 30
